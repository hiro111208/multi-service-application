# Multi-service stack orchestration
#
# Startup order (via depends_on + health checks):
#   mongodb, redis  →  api  →  nginx
#   web (parallel)  ↗
#
# Internal DNS hostnames match service names:
#   mongodb, redis, api, web, nginx
#
# Public entry point: nginx (${NGINX_HTTP_PORT} → 80)
# All other services are internal-only (no host ports).

name: ${COMPOSE_PROJECT_NAME:-multi-service-app}

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    secrets:
      - mongodb_password
    entrypoint: ["/bin/bash", "/docker-entrypoint-init.sh"]
    command: ["mongod"]
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/docker-entrypoint-init.sh:/docker-entrypoint-init.sh:ro
      - ./docker/mongodb/healthcheck.sh:/healthcheck.sh:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/bin/bash", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: multi-service-api-base:latest
    image: multi-service-api:latest
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MONGODB_HOST: mongodb
      MONGODB_PORT: ${MONGODB_PORT}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_AUTH_SOURCE: ${MONGODB_AUTH_SOURCE}
      MONGODB_PASSWORD_FILE: /run/secrets/mongodb_password
      SECRET_KEY_FILE: /run/secrets/api_secret_key
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS}
    secrets:
      - mongodb_password
      - api_secret_key
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: multi-service-web-base:latest
    image: multi-service-web:latest
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  mongodb_password:
    file: ./docker/secrets/mongodb_password
  api_secret_key:
    file: ./docker/secrets/api_secret_key

volumes:
  mongodb_data:
  redis_data:

networks:
  app-network:
    name: ${COMPOSE_PROJECT_NAME:-multi-service-app}_network
    driver: bridge
